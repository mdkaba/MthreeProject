services:
  mysql:
    image: mysql:8.0
    container_name: time_tracker_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: time_tracker
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build:
      context: ./backend
    container_name: time_tracker_backend
    restart: always
    depends_on:
      - mysql
    environment:
      DB_HOST: mysql
      DB_USER: root
      DB_PASSWORD: root
      DB_NAME: time_tracker
      JWT_SECRET_KEY: this_is_a_long_secure_jwt_secret_key_for_docker_123456
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app

volumes:
  mysql_data: